<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multi-Patient Triage Checker</title>
    <style>
        body { 
            font-family: sans-serif; 
            line-height: 1.6; 
            padding: 20px; 
            background-color: #f4f4f9; 
            position: relative; 
            background-image: repeating-linear-gradient(
                45deg,
                rgba(0,0,0,0.03) 0,
                rgba(0,0,0,0.03) 1px,
                transparent 1px,
                transparent 100px
            );
        }
        .container { 
            position: relative; 
            z-index: 10; 
            max-width: 900px; 
            margin: auto; 
            background: white; 
            padding: 25px; 
            border-radius: 8px; 
            box-shadow: 0 0 15px rgba(0,0,0,0.2); 
        }
        h2 { color: #0056b3; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        select, input[type="text"] { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; margin-top: 20px; }
        button:hover { background-color: #218838; }
        .patient-section { border: 2px solid #0056b3; padding: 15px; margin-top: 25px; border-radius: 6px; background-color: #e6f7ff; }
        .patient-header { background-color: #0056b3; color: white; padding: 8px; margin: -15px -15px 15px -15px; border-radius: 4px 4px 0 0; font-size: 1.1em; }
        .priority-result { margin-top: 25px; padding: 15px; border-radius: 4px; font-size: 1.1em; font-weight: bold; }
        .critical { background-color: #ffcccc; color: #cc0000; border: 1px solid #ff9999; }
        .high { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .mediumhigh { background-color: #ffebcc; color: #cc6600; border: 1px solid #ffcc99; }
        .medium { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .low { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        #results-summary ul { list-style: none; padding: 0; }
        #results-summary li { margin: 8px 0; padding: 10px; border-left: 5px solid #0056b3; background-color: #f9f9f9; }
        #results-summary h3 { margin-top: 25px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏥 Multi-Patient Triage Checker</h2>
    
    <label for="numPatients">Select Number of Patients:</label>
    <select id="numPatients" onchange="generatePatientSections()">
        <option value="1">1 Patient</option>
        <option value="2">2 Patients</option>
        <option value="3">3 Patients</option>
        <option value="4">4 Patients</option>
        <option value="5">5 Patients</option>
        <option value="6">6 Patients</option>
        <option value="7">7 Patients</option>
        <option value="8">8 Patients</option>
    </select>

    <div id="patient-inputs"></div>
    <button onclick="checkAllPriorities()">Check All Priorities</button>
    <div id="results-summary"></div>
</div>

<script>
const diseaseData = {
    "Heart/Cardiac": { 
        priority: "CRITICAL", 
        params: ["Chest Pain Severity", "Pulse", "BP Systolic"], 
        thresholds: { 'Chest Pain Severity': 'Severe', 'Pulse': 'Arrhythmia', 'BP Systolic': 180 } 
    },
    "Respiratory/Asthma": { 
        priority: "HIGH", 
        params: ["SpO2 (%)", "Breathing Rate"], 
        thresholds: { 'SpO2 (%)': 90 } 
    },
    "Diabetes/Hyperglycemia": { 
        priority: "MEDIUM-HIGH", 
        params: ["Blood Sugar (mg/dL)"], 
        thresholds: { 'Blood Sugar (mg/dL)': 300 } 
    },
    "Hypertension/High BP": { 
        priority: "HIGH", 
        params: ["BP Systolic", "BP Diastolic"], 
        thresholds: { "BP Systolic": 160, "BP Diastolic": 100 } 
    },
    "Fever/Infection": { 
        priority: "MEDIUM", 
        params: ["Temp (°F)"], 
        thresholds: { 'Temp (°F)': 102 } 
    }
};

const getInputId = (patientIndex, param) => `patient${patientIndex}-${param.replace(/[ %()]/g, '')}`;

function createInputField(patientIndex, param) {
    const inputId = getInputId(patientIndex, param);
    let placeholderText = "Enter " + param + " value";
    if (param === "BP Systolic") placeholderText = "e.g., 120, 130";
    else if (param === "BP Diastolic") placeholderText = "e.g., 80, 90";
    else if (param === "Pulse") placeholderText = "e.g., 70, 100";
    else if (param === "SpO2 (%)") placeholderText = "e.g., 95, 88";
    else if (param === "Temp (°F)") placeholderText = "e.g., 101, 102";
    else if (param === "Blood Sugar (mg/dL)") placeholderText = "e.g., 180, 250";

    let html = `<label for="${inputId}">${param}:</label>`;
    if (param.includes('Severity') || param.includes('Difficulty')) {
        html += `<select id="${inputId}">
                    <option value="Mild">Mild / Normal</option>
                    <option value="Moderate">Moderate / Slight</option>
                    <option value="Severe">Severe / High</option>
                 </select>`;
    } else if (param === 'Consciousness') {
        html += `<select id="${inputId}">
                    <option value="Normal">Normal</option>
                    <option value="Reduced">Reduced / Confused</option>
                 </select>`;
    } else {
         html += `<input type="text" id="${inputId}" placeholder="${placeholderText}">`;
    }
    return html;
}

function generatePatientSection(index) {
    const patientNum = index + 1;
    return `<div class="patient-section" id="patient-${patientNum}-section">
        <div class="patient-header">Patient ${patientNum}</div>
        <label for="disease-${patientNum}">Select Disease / Condition:</label>
        <select id="disease-${patientNum}" onchange="showParameters(${patientNum})">
            <option value="">-- Select --</option>
            <option value="Heart/Cardiac">Heart / Cardiac Problems</option>
            <option value="Respiratory/Asthma">Respiratory / Asthma</option>
            <option value="Diabetes/Hyperglycemia">Diabetes / Hyperglycemia</option>
            <option value="Hypertension/High BP">Hypertension / High BP</option>
            <option value="Fever/Infection">Fever / Infection</option>
        </select>
        <div id="parameter-input-${patientNum}"></div>
        <div id="result-${patientNum}" class="priority-result"></div>
    </div>`;
}

function generatePatientSections() {
    const numPatients = parseInt(document.getElementById('numPatients').value);
    const inputDiv = document.getElementById('patient-inputs');
    inputDiv.innerHTML = '';
    for (let i = 0; i < numPatients; i++) {
        inputDiv.innerHTML += generatePatientSection(i);
    }
}

function showParameters(patientNum) {
    const select = document.getElementById(`disease-${patientNum}`);
    const diseaseName = select.value;
    const inputDiv = document.getElementById(`parameter-input-${patientNum}`);
    if (!diseaseName) { inputDiv.innerHTML = ''; return; }
    const data = diseaseData[diseaseName];
    let html = '';
    data.params.forEach(param => { if (param !== 'N/A') html += createInputField(patientNum, param); });
    inputDiv.innerHTML = html;
}

function checkAllPriorities() {
    const numPatients = parseInt(document.getElementById('numPatients').value);
    const summaryDiv = document.getElementById('results-summary');
    let summaryHTML = '';
    let patientResults = [];

    for (let i = 1; i <= numPatients; i++) {
        const diseaseSelect = document.getElementById(`disease-${i}`);
        const resultDiv = document.getElementById(`result-${i}`);
        if (!diseaseSelect || !diseaseSelect.value) {
            resultDiv.innerHTML = `<p class="low">⚠️ Please select a disease for Patient ${i}.</p>`;
            continue;
        }
        const diseaseName = diseaseSelect.value;
        const data = diseaseData[diseaseName];
        let isHighRisk = false;
        let highRiskMessage = '';
        for (const [param, threshold] of Object.entries(data.thresholds)) {
            const inputId = getInputId(i, param);
            const inputValue = document.getElementById(inputId) ? document.getElementById(inputId).value.trim() : null;
            if (inputValue) {
                if (typeof threshold === 'number') {
                    const numValue = parseFloat(inputValue);
                    if ((param === 'GCS' || param.includes('SpO2')) && numValue <= threshold) { isHighRisk = true; highRiskMessage = `${param}: ${inputValue}`; break; }
                    else if (numValue > threshold) { isHighRisk = true; highRiskMessage = `${param}: ${inputValue}`; break; }
                } else if (inputValue === threshold) { isHighRisk = true; highRiskMessage = `${param}: ${inputValue}`; break; }
            }
        }

        let finalPriority = data.priority;
        let priorityClass = finalPriority.toLowerCase().replace('-', '');
        let detailedMessage = isHighRisk ? `**IMMEDIATE ATTENTION REQUIRED!** Reason: ${highRiskMessage}` : `Current status is stable. Base Priority: ${data.priority}.`;
        if (isHighRisk) { finalPriority = `🚨 CRITICAL (${data.priority} Base)`; priorityClass = 'critical'; }

        resultDiv.className = `priority-result ${priorityClass}`;
        resultDiv.innerHTML = `<p><strong>Priority Level: ${finalPriority}</strong></p><p>${detailedMessage}</p>`;
        patientResults.push({ patient: `Patient ${i}`, priority: finalPriority, class: priorityClass });
    }

    if (patientResults.length > 0) {
        const ordering = { "critical": 1, "high": 2, "mediumhigh": 3, "medium": 4, "low": 5 };
        patientResults.sort((a,b) => ordering[a.class.replace('-', '')] - ordering[b.class.replace('-', '')]);
        summaryHTML += `<h3>🏥 Final Treatment Order (Highest First):</h3><ul>`;
        patientResults.forEach((res, index) => { summaryHTML += `<li class="${res.class}"><strong>${index+1}. ${res.patient}:</strong> ${res.priority}</li>`; });
        summaryHTML += '</ul>';
    } else summaryHTML += '<p>No patients processed.</p>';

    summaryDiv.innerHTML = summaryHTML;
}

document.addEventListener('DOMContentLoaded', generatePatientSections);
</script>

</body>
</html>
